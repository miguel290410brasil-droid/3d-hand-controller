<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Controller - Webcam e Scripting</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <style>
        /* Estilo simples para centralizar e garantir que o corpo ocupe toda a tela */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Evita barras de rolagem */
            background-color: #AAAAAA; /* Fundo Cinza para o BODY */
        }
        /* Estilo para o vídeo da webcam, que fica visível, mas em uma posição discreta */
        #webcam {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            z-index: 10;
            border: 2px solid white;
            transform: scaleX(-1); /* Espelha o vídeo para ser mais intuitivo */
        }
        /* O canvas p5.js será o elemento principal da cena 3D */
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <script>
        // Variáveis para p5.js e ml5.js
        let handpose;
        let video;
        let predictions = [];

        // Variável para a posição do cubo (bloco)
        let boxPosition = { x: 0, y: 0, z: 0 };
        const videoWidth = 160;
        const videoHeight = 120;

        /**
         * Função setup (Configuração Inicial)
         */
        function setup() {
            // Cria o canvas usando WEBGL para renderização 3D
            createCanvas(windowWidth, windowHeight, WEBGL);
            
            // 1. Configura o fundo cinza (embora o body já seja cinza, definimos o fundo do canvas também)
            background(170); // Cinza (#AAAAAA)

            // 2. Configura a webcam
            video = createCapture(VIDEO);
            video.size(videoWidth, videoHeight); // Define o tamanho para o feed do modelo
            video.id('webcam'); // Atribui um ID para o CSS
            video.hide(); // Oculta o elemento de vídeo p5.js, mas o CSS o torna visível separadamente
            
            // 3. Inicializa o modelo Handpose do ml5.js
            handpose = ml5.handpose(video, modelReady);

            // Quando o modelo detectar algo, armazena os resultados na variável 'predictions'
            handpose.on('predict', results => {
                predictions = results;
            });

            // Ajusta o modo da câmera/perspectiva
            perspective(PI / 3.0, width / height, 0.1, 500); 
        }

        /**
         * Função chamada quando o modelo ml5.js está pronto
         */
        function modelReady() {
            console.log('Modelo Handpose carregado!');
            select('#webcam').elt.style.display = 'block'; // Mostra o elemento de vídeo (webcam no canto)
        }

        /**
         * Função draw (Loop de Desenho)
         */
        function draw() {
            // 1. Fundo Cinza
            background(170);

            // Configurações de luz e material para 3D
            lights(); // Adiciona luz para ver o cubo
            ambientLight(100);
            directionalLight(255, 255, 255, 0, 0, -1);
            
            // 3. Desenha 1 Bloco (Cubo)
            push(); // Salva o estado de transformação atual
            translate(boxPosition.x, boxPosition.y, boxPosition.z); // Move o cubo
            rotateX(frameCount * 0.01); // Pequena rotação para efeito 3D
            rotateY(frameCount * 0.01);
            normalMaterial(); // Material padrão
            box(50); // Desenha um cubo de 50x50x50
            pop(); // Restaura o estado de transformação

            // 4. Desenha a Mão Virtual e 5. Eixo Z na Mão (bolinhas)
            if (predictions.length > 0) {
                let hand = predictions[0];
                let landmarks = hand.landmarks;

                // Usa o ponto do pulso (landmark 0) para controlar a posição do cubo
                // Mapeia os valores 2D (x, y) e 3D (z) da mão para o espaço 3D do p5.js
                // Lembre-se que as coordenadas x/y do MediaPipe são normalizadas de 0 a 1 e espelhadas (por isso -x)
                
                let wrist = landmarks[0];
                
                // Mapeamento X (horizontal): inverte X e ajusta o centro
                boxPosition.x = map(wrist[0], 0, 1, width / 2, -width / 2);
                // Mapeamento Y (vertical): inverte Y (porque o p5.js Y é para baixo)
                boxPosition.y = map(wrist[1], 0, 1, -height / 2, height / 2);
                // Mapeamento Z (profundidade): usa o Z do landmark. Valores positivos para mais perto.
                // Multiplicamos por um fator (ex: -100) para ter um efeito visível de profundidade.
                boxPosition.z = map(wrist[2], -0.5, 0.5, 200, -200); 
                
                // Desenha as bolinhas (pontos de referência)
                fill(255, 0, 0); // Cor vermelha para as articulações
                noStroke();
                
                for (let i = 0; i < landmarks.length; i++) {
                    let landmark = landmarks[i];
                    
                    // Converte as coordenadas do landmark para o espaço 3D do p5.js
                    let x = map(landmark[0], 0, 1, width / 2, -width / 2);
                    let y = map(landmark[1], 0, 1, -height / 2, height / 2);
                    // O Z também é mapeado para o espaço 3D (usa o mesmo mapeamento de boxPosition.z ou similar)
                    let z = map(landmark[2], -0.5, 0.5, 200, -200); 
                    
                    push();
                    translate(x, y, z);
                    sphere(5); // Desenha uma esfera (bolinha)
                    pop();
                }
            }

            // Exibe o feed da webcam (opcional, já está visível no canto via CSS)
            // Para mostrar o vídeo no 3D:
            // texture(video);
            // plane(videoWidth, videoHeight); // Desenha o vídeo como uma textura em um plano
        }
        
        /**
         * Ajusta o canvas quando a janela é redimensionada
         */
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            perspective(PI / 3.0, width / height, 0.1, 500); 
        }

    </script>
</body>
</html>
