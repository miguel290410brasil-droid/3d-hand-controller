<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Hand Controller - index</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    .wrap{display:flex;gap:14px;padding:14px;align-items:flex-start}
    .video-wrap{position:relative}
    video,canvas{border-radius:8px;background:#000;display:block}
    #video{width:640px;height:480px;transform:scaleX(-1)}
    #overlay{position:absolute;left:0;top:0}
    .ui{width:320px}
    button{display:block;padding:8px 12px;margin:8px 0}
    pre{background:#222;padding:8px;border-radius:6px;max-height:320px;overflow:auto}
    label{display:flex;align-items:center;gap:8px;margin:6px 0}
    small{opacity:0.8}
  </style>

  <!-- MediaPipe (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="ui">
      <h3>Hand Controller</h3>
      <button id="btnConnect">Conectar WebSocket</button>
      <div>WS: <span id="wsState">desconectado</span></div>
      <label><input id="sendRaw" type="checkbox" /> enviar raw landmarks</label>
      <label><input id="mirrorPreview" type="checkbox" checked /> espelhar preview</label>
      <p><small>Se o websocket estiver offline, o cliente ainda mostra o overlay.</small></p>
      <h4>Último pacote (resumo)</h4>
      <pre id="last">nenhum</pre>
      <p><small>Abra o servidor WS em ws://localhost:8080 (arquivo server.js).</small></p>
    </div>
  </div>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const lastEl = document.getElementById('last');
  const wsState = document.getElementById('wsState');
  const btnConnect = document.getElementById('btnConnect');
  const sendRawCheckbox = document.getElementById('sendRaw');
  const mirrorCheckbox = document.getElementById('mirrorPreview');

  let ws = null;
  btnConnect.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); return; }
    wsState.textContent = 'conectando...';
    ws = new WebSocket('ws://localhost:8080');
    ws.addEventListener('open', () => wsState.textContent = 'conectado');
    ws.addEventListener('close', () => wsState.textContent = 'desconectado');
    ws.addEventListener('error', () => wsState.textContent = 'erro');
    ws.addEventListener('message', ev => {
      // opcional: exibir mensagens do servidor
      // console.log('from server', ev.data);
    });
  });

  // Mapeamento params (ajuste conforme necessário)
  const SCALE_XY = 3.2;
  const DEPTH_SCALE = 3.0;
  const DEPTH_OFFSET = 0.12;

  // Inicializa MediaPipe Hands
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  hands.onResults(onResults);

  // Inicia câmera
  const camera = new Camera(video, {
    onFrame: async () => { await hands.send({image: video}); },
    width: 640,
    height: 480
  });
  camera.start();

  function mapLandmark(lm, width, height) {
    const x_px = lm.x * width;
    const y_px = lm.y * height;
    const z_rel = lm.z;
    const nx = (x_px / width - 0.5) * SCALE_XY;
    const nz = (0.5 - y_px / height) * SCALE_XY;
    const ny = (-z_rel) * DEPTH_SCALE + DEPTH_OFFSET;
    return { x: nx, y: ny, z: nz };
  }

  function drawMirrorImage(image) {
    ctx.save();
    if (mirrorCheckbox.checked) {
      ctx.scale(-1,1);
      ctx.drawImage(image, -canvas.width, 0, canvas.width, canvas.height);
    } else {
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    }
    ctx.restore();
  }

  function onResults(results) {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (results.image) drawMirrorImage(results.image);

    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
      lastEl.textContent = 'nenhuma mão';
      return;
    }

    const landmarks = results.multiHandLandmarks[0];

    // desenhar esqueleto / pontos
    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color:'#00FF88', lineWidth:2});
    drawLandmarks(ctx, landmarks, {color:'#FF0066', lineWidth:1});

    // mapear landmarks
    const mapped = landmarks.map(lm => mapLandmark(lm, canvas.width, canvas.height));

    const payload = {
      t: Date.now(),
      landmarks: mapped
    };

    // enviar via WS se conectado
    if (ws && ws.readyState === WebSocket.OPEN) {
      const out = sendRawCheckbox.checked ? { raw: landmarks } : payload;
      ws.send(JSON.stringify(out));
      wsState.textContent = 'conectado (enviando)';
    }

    // resumo para UI
    lastEl.textContent = JSON.stringify({
      t: payload.t,
      l0: mapped[0],
      l4: mapped[4],
      l8: mapped[8]
    }, null, 2);
  }
})();
</script>
</body>
</html>
