<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Controller - Webcam e Scripting</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-color: #AAAAAA; /* Fundo Cinza (Nível Body) */
        }
        /* Estilo para a webcam no canto superior direito */
        #webcam {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            z-index: 10;
            border: 2px solid white;
            transform: scaleX(-1); /* Espelha o vídeo para ser intuitivo */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <script>
        // Variáveis globais
        let handpose;
        let video;
        let predictions = [];
        let boxPosition = { x: 0, y: 0, z: 0 };

        const videoWidth = 160;
        const videoHeight = 120;

        // ----------------- FUNÇÃO SETUP -----------------
        function setup() {
            // Cria o canvas em modo WEBGL para renderização 3D
            createCanvas(windowWidth, windowHeight, WEBGL);
            
            // Configura a webcam
            video = createCapture(VIDEO);
            video.size(videoWidth, videoHeight);
            video.id('webcam'); // ID para o CSS
            video.hide(); // Oculta o elemento de vídeo p5.js

            // Inicializa o modelo Handpose do ml5.js
            handpose = ml5.handpose(video, modelReady);

            // Callback para atualizar as previsões
            handpose.on('predict', results => {
                predictions = results;
            });

            // Configura a perspectiva 3D
            perspective(PI / 3.0, width / height, 0.1, 1000); 
        }

        function modelReady() {
            console.log('Modelo Handpose carregado com sucesso!');
            // Torna o elemento de vídeo visível no canto
            select('#webcam').elt.style.display = 'block'; 
        }

        // ----------------- FUNÇÃO DRAW (LOOP PRINCIPAL) -----------------
        function draw() {
            // 1. Fundo Cinza
            background(170);

            // Configurações de luz
            ambientLight(100);
            directionalLight(255, 255, 255, 0, 0, -1);
            
            // Rastreamento e Mapeamento
            if (predictions.length > 0) {
                let hand = predictions[0];
                let landmarks = hand.landmarks;

                // Usa o ponto de referência do pulso (landmark 0) para controlar o cubo.
                let wrist = landmarks[0];
                
                // Mapeamento X (Horizontal): Inverte X para movimento intuitivo.
                // O mapeamento vai de 0 a 1 (normalizado) para a largura do canvas.
                boxPosition.x = map(wrist[0], 0, 1, width / 2, -width / 2);
                
                // Mapeamento Y (Vertical): Inverte Y (p5.js Y é positivo para baixo)
                boxPosition.y = map(wrist[1], 0, 1, -height / 2, height / 2);
                
                // 5. Mapeamento Eixo Z (Profundidade): Valores positivos do Z do MediaPipe significam mais perto da câmera.
                // Mapeamos para o espaço 3D (ex: de -400 (longe) a 400 (perto)).
                // Ajuste os valores -0.5 e 0.5 conforme a sensibilidade desejada.
                boxPosition.z = map(wrist[2], -0.5, 0.5, -400, 400); 
                
                // -----------------------------------------------------
                // 4. Desenha Mão Virtual (Bolinhas nas Articulações)
                fill(255, 0, 0); // Cor vermelha para as bolinhas
                noStroke();
                
                for (let i = 0; i < landmarks.length; i++) {
                    let landmark = landmarks[i];
                    
                    // Converte as coordenadas do landmark para o espaço 3D do p5.js
                    let x = map(landmark[0], 0, 1, width / 2, -width / 2);
                    let y = map(landmark[1], 0, 1, -height / 2, height / 2);
                    let z = map(landmark[2], -0.5, 0.5, -400, 400); 
                    
                    push();
                    translate(x, y, z);
                    sphere(5); // Desenha a bolinha
                    pop();
                }
            }
            
            // -----------------------------------------------------
            // 3. Desenha 1 Bloco (Cubo)
            
            push(); 
            // O cubo segue a posição 3D mapeada do pulso
            translate(boxPosition.x, boxPosition.y, boxPosition.z); 
            
            // Adiciona uma rotação suave para efeito visual
            rotateX(frameCount * 0.005);
            rotateY(frameCount * 0.005);
            
            normalMaterial(); // Material simples para o cubo
            box(80); // Desenha um cubo (bloco)
            pop(); 
        }
        
        // Função para garantir que o canvas se adapte ao tamanho da janela
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            perspective(PI / 3.0, width / height, 0.1, 1000); 
        }
    </script>
</body>
</html>
